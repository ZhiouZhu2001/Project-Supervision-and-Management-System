name: psms

# Base stack: nothing is published to the host here on purpose. Development
# bindings live in docker-compose.dev.yml (loopback only) and production
# exposure arrives with the deployment ticket. Starting from "no published
# ports" means the accidental-public-database failure cannot happen by default.
#
# The defaults below exist so that `make dev` works on a clean clone with no
# configuration. They are development values: the application refuses to boot
# with APP_ENV=production while the secret is still the development default.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supervision}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      # Invariant 7: every stored timestamp is UTC, so the server must agree.
      TZ: UTC
      PGTZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks: [internal]

  api:
    build:
      context: ./apps/api
      target: runtime
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-devpassword}@db:5432/${POSTGRES_DB:-supervision}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-dev-only-not-a-secret}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      APP_ENV: ${APP_ENV:-development}
      APP_EMAIL: ${APP_EMAIL:-owner@example.com}
      APP_PASSWORD: ${APP_PASSWORD:-devpassword}
      RUN_MIGRATIONS: "1"
      UPLOAD_DIR: /data/uploads
      TZ: UTC
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      # Shared with nginx, which serves the files through X-Accel-Redirect.
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/healthz', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    networks: [internal]

  web:
    build:
      context: ./apps/web
      target: runtime
    environment:
      # Server-side rendering talks to the API over the compose network; the
      # browser talks to the same origin through the proxy. Two base URLs,
      # one origin — see the architecture note on this.
      INTERNAL_API_BASE: http://api:8000
      NEXT_PUBLIC_API_BASE: /api
      NODE_ENV: ${NODE_ENV:-production}
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    restart: unless-stopped
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/data/uploads:ro
    depends_on:
      - web
      - api
    restart: unless-stopped
    networks: [internal]

volumes:
  pgdata:
  uploads:

networks:
  internal:
    driver: bridge
