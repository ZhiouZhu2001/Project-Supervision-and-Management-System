# Single entry point. Everything the browser reaches arrives through here, so
# cookies are same-origin and no CORS configuration exists anywhere.
#
# Upstreams are resolved at request time through Docker's embedded DNS
# (127.0.0.11) rather than once at startup. Without this, recreating a
# container — which every `docker compose up -d --build api` does — leaves
# nginx holding a stale IP and answering 502 until it is restarted by hand.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # The application caps uploads at 5 MB; the proxy refuses oversize bodies
    # before they reach Python, which is cheaper and cannot be bypassed.
    client_max_body_size 6m;

    # Never advertise the exact proxy version.
    server_tokens off;

    set $api_upstream http://api:8000;
    set $web_upstream http://web:3000;

    # Health is proxied like everything else so that the same URL works from
    # the host, from a container, and from an uptime checker.
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass $web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
